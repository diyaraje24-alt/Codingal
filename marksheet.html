<html>
    <head>
    <title>
        MarkSheet
    </title>
</head>
<body>
    <form oninput="x.value=(parseInt(m1.value)+parseInt(m2.value)+parseInt(m3.value))/3">
    <legend><h1>MarkSheet</h1></legend>
    <select>
        <option>English</option>
        <option>Science</option><br>
        <input type="numbers"placeholder="Enter your mark">
        </select><br><br>
        <select>
        <option>Basic Maths</option>
        <option>Standard Maths</option><br>
        <input type="numbers"placeholder="Enter your mark">
        </select><br><br>
        <select>
        <option>Sanskirt</option>
        <option>Hindi</option><br>
        <input type="numbers"placeholder="Enter your mark">
        </select><br><br>
        <inputtype="number"id="m3"name="m3"><br>
        Average:<output name="x"for="m1 m2 m3"></output>
        </form>
</body>
</html>
